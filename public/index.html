<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Littlewood 怪题集 · 用常识解释奇怪的科学问题</title>
<meta name="description" content="收集反直觉的科学怪题，用受力图、示意图和一点点算术讲清楚。">
<style>
:root{
  --paper:#f7f8f4; --grid:rgba(70,110,150,.10); --ink:#26303c; --muted:#67717d;
  --line:#ccd4dc; --red:#c9342a; --blue-ink:#2456a6;
  --kai:"Kaiti SC","STKaiti","KaiTi","FangSong",serif;
}
*{box-sizing:border-box}
::selection{background:#f6d9d6}
body{
  margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  line-height:1.85;font-size:16px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:56px 20px 64px}

/* ---- 封面 ---- */
.cover{position:relative;background:#fff;border:2px solid var(--ink);padding:60px 28px 44px;text-align:center}
.cover::before{content:"";position:absolute;inset:7px;border:1px solid var(--ink);pointer-events:none}
.cover .series{letter-spacing:.5em;font-size:.85rem;color:var(--muted);text-indent:.5em}
.cover h1{font-weight:900;font-size:clamp(2.6rem,9vw,4.2rem);letter-spacing:.28em;text-indent:.28em;margin:18px 0 10px;line-height:1.2}
.cover .tagline{font-family:var(--kai);font-size:1.15rem;margin:0 0 26px}
.cover .rule{width:120px;height:2px;background:var(--red);margin:0 auto 26px}
.cover .law{font-family:var(--kai);color:var(--blue-ink);max-width:440px;margin:0 auto 34px;font-size:.98rem}
.cover .fields{font-family:var(--kai);font-size:1.02rem;display:flex;justify-content:center;gap:2.2em;flex-wrap:wrap}
.cover .fields i{display:inline-block;width:5.5em;border-bottom:1px solid var(--ink);height:1em;vertical-align:baseline}

/* ---- 目录 ---- */
.toc-head{display:flex;align-items:center;gap:14px;margin:56px 0 20px;font-size:1.35rem;font-weight:800;border-bottom:1px solid var(--line);padding-bottom:12px}
.toc-head .mark{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border:2px solid var(--red);border-radius:50%;color:var(--red);font-family:var(--kai);font-size:1rem}
a.item{
  display:block;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:20px 22px;text-decoration:none;color:var(--ink);
  transition:border-color .15s,transform .15s;
}
a.item:hover{border-color:var(--red);transform:translateY(-2px)}
.item .qnum{font-family:var(--kai);color:var(--red);font-weight:700}
.item h3{font-size:1.15rem;line-height:1.6;margin:6px 0 8px;font-weight:800}
.item .hook{font-family:var(--kai);color:#48535f;font-size:.98rem;margin:0 0 14px}
.item svg{display:block;width:100%;max-width:360px;height:auto;margin:0 0 12px}
.item .go{font-weight:700;color:var(--red)}
p.more{font-family:var(--kai);color:var(--muted);text-align:center;margin-top:32px}

footer{max-width:760px;margin:0 auto;padding:0 20px 48px;color:var(--muted);font-size:.9rem;text-align:center;font-family:var(--kai)}
footer a{color:var(--muted)}
@media (max-width:560px){body{font-size:15px}.cover{padding:44px 16px 34px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<main>

        <marker id="aNew" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker>
      </defs>
      <line x1="30" y1="58" x2="288" y2="58" stroke="#e8590c" stroke-width="12" stroke-linecap="round" marker-end="url(#aOld)"/>
      <line x1="610" y1="58" x2="352" y2="58" stroke="#6741d9" stroke-width="12" stroke-linecap="round" marker-end="url(#aNew)"/>
      <rect x="310" y="22" width="20" height="72" rx="4" fill="#7cb7e8"/>
      <text x="160" y="30" text-anchor="middle" font-size="15" fill="#e8590c">≈1000 吨力</text>
      <text x="480" y="30" text-anchor="middle" font-size="15" fill="#6741d9">≈1000 吨力</text>
      <text x="320" y="122" text-anchor="middle" font-size="14" fill="#26303c">中间：约 1 kg 水</text>
    </svg>

  </a>

  <p class="more">更多怪题正在路上。</p>
</main>

<footer>

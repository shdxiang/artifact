<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>小木头 · 用中学知识，把反直觉的科学问题画明白</title>
<meta name="description" content="小木头（Littlewood）：用受力图、示意图和一点点算术，把反直觉的科学问题讲清楚。">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2">
<style>
:root{
  --paper:#f7f2e9; --ink:#3a3128; --muted:#7a6f60; --line:#e4dac8;
  --wood:#d9a05e; --wood-deep:#a86f32; --blue:#2f6bb3;
  --round:"Yuanti SC","幼圆","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
::selection{background:#f0dcbe}
body{
  margin:0;color:var(--ink);background:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  line-height:1.85;font-size:16px;
}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
main{max-width:760px;margin:0 auto;padding:64px 20px 64px}

.cover{text-align:center}
.cover .mascot{width:170px;height:auto;display:block;margin:0 auto}
.cover .mascot .eye{transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.cover h1{font-family:var(--round);font-weight:800;font-size:clamp(2.4rem,8vw,3.6rem);letter-spacing:.12em;margin:18px 0 8px}
.cover .tagline{font-family:var(--round);font-size:1.12rem;margin:0;color:#5c5344}
.cover .littlewood{font-size:.88rem;color:var(--muted);margin:10px 0 0}

.plank{height:14px;border-radius:7px;margin:44px auto;max-width:520px;
  background:repeating-linear-gradient(90deg,#d9a05e 0 46px,#cd9354 46px 92px);
  border:2px solid var(--wood-deep)}

.toc-head{display:flex;align-items:center;gap:14px;margin:0 0 20px;font-family:var(--round);font-size:1.35rem;font-weight:800;border-bottom:1px solid var(--line);padding-bottom:12px}
a.item{
  display:block;background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:20px 22px;text-decoration:none;color:var(--ink);
  transition:border-color .15s,transform .15s;
}
a.item:hover{border-color:var(--wood);transform:translateY(-2px)}
.item .qnum{display:inline-flex;align-items:center;justify-content:center;width:2.1em;height:2.1em;background:var(--wood);border:2px solid var(--wood-deep);box-shadow:0 3px 0 var(--wood-deep);border-radius:9px;color:#fff;font-weight:800;font-family:var(--round)}
.item h3{font-family:var(--round);font-size:1.15rem;line-height:1.6;margin:12px 0 8px;font-weight:800}
.item .hook{color:#5c5344;font-size:.96rem;margin:0 0 14px}
.item svg.thumb{display:block;width:100%;max-width:360px;height:auto;margin:0 0 12px}
.item .go{font-weight:700;color:var(--blue)}
p.more{color:var(--muted);text-align:center;margin-top:32px}

footer{max-width:760px;margin:0 auto;padding:0 20px 48px;color:var(--muted);font-size:.9rem;text-align:center}
footer a{color:var(--muted)}
@media (max-width:560px){body{font-size:15px}.cover .mascot{width:130px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

    <h3>为什么 1 千克的薄层水，仍可能让挡板承受 1000 吨力？</h3>

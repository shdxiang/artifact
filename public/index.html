<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小木块 · 用中学知识，把反直觉的科学问题画明白</title>
<meta name="description" content="小木块（Littlewood）：用受力图、示意图和一点点算术，把反直觉的科学问题讲清楚。">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2">
<style>
:root{
  --bg:#0b0f14; --panel:#131a22; --code:#0f151d; --line:#22303c;
  --fg:#e6edf3; --mut:#93a4b3;
  --o:#ff9f43; --g:#3ddc97; --b:#4aa8ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
::selection{background:rgba(74,168,255,.35)}
body{
  margin:0;color:var(--fg);
  background:radial-gradient(60% 46% at 50% 0%,#1a2430 0%,rgba(26,36,48,0) 100%),var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  line-height:1.75;font-size:16px;min-height:100vh;
}
a{color:var(--b)}
:focus-visible{outline:3px solid var(--b);outline-offset:2px;border-radius:6px}
main{max-width:760px;margin:0 auto;padding:clamp(52px,10vw,84px) 20px 64px}

.cover{text-align:center}
.cover .mascot{width:170px;height:auto;display:block;margin:0 auto}
.cover .mascot .eye{transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.cover h1{font-weight:800;font-size:clamp(2.4rem,8vw,3.4rem);letter-spacing:.1em;margin:18px 0 8px}
.cover .tagline{font-size:1.12rem;margin:0;color:var(--mut)}
.cover .littlewood{font-size:.88rem;color:var(--mut);margin:10px 0 0;opacity:.85}

.blocks{display:flex;justify-content:center;gap:14px;margin:46px 0}
.blocks i{width:14px;height:14px;border-radius:4px;background:var(--o)}
.blocks i:nth-child(2){background:var(--g)}
.blocks i:nth-child(3){background:var(--b)}

.toc-head{display:flex;align-items:center;gap:14px;margin:0 0 20px;font-size:1.3rem;font-weight:700;letter-spacing:-.3px;border-bottom:1px solid var(--line);padding-bottom:12px}
a.item{
  display:block;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:20px 22px;text-decoration:none;color:var(--fg);
  transition:border-color .15s,transform .15s;
}
a.item:hover{border-color:var(--o);transform:translateY(-2px)}
.item .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:2.3em;height:2.3em;padding:0 .5em;background:var(--o);border-radius:999px;color:#0b0f14;font:700 .82rem/1 var(--mono)}
.item h3{font-size:1.15rem;line-height:1.6;margin:12px 0 8px;font-weight:700}
.item .hook{color:var(--mut);font-size:.96rem;margin:0 0 14px}
.item svg.thumb{display:block;width:100%;max-width:420px;height:auto;margin:0 0 12px;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:8px}
.item .go{font-weight:700;color:var(--o)}
p.more{color:var(--mut);text-align:center;margin-top:32px}

footer{max-width:760px;margin:0 auto;padding:28px 20px 48px;color:var(--mut);font-size:.9rem;text-align:center;border-top:1px solid var(--line)}
footer a{color:var(--mut)}
@media (max-width:560px){body{font-size:15px}.cover .mascot{width:130px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

    <p class="tagline">用中学知识，把反直觉的科学问题画明白</p>

  <a class="item" href="./hydrostatic-paradox.html">
    <span class="qnum">01</span>
    <h3>为什么 1 千克的薄层水，仍可能让挡板承受 1000 吨力？</h3>
    <p class="hook">一瓶矿泉水的量，夹在两块挡板之间——挡板却顶着一千吨的力，哪儿都没算错。质量和力，是两回事。</p>
    <svg class="thumb" viewBox="0 60 320 156" role="img" aria-label="斜面上一大楔子水被新挡板隔开，两板之间只剩一条极薄的水缝，原挡板仍承受约 1000 吨力">
      <defs>
        <marker id="aOld" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f43"/></marker>
        <marker id="aNew" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b18cff"/></marker>
      </defs>
      <line x1="15" y1="185" x2="312" y2="68" stroke="#93a4b3" stroke-width="3" stroke-linecap="round"/>
      <path d="M60,166 L30,94 L41.5,94 L70,162 Z" fill="rgba(74,168,255,.5)" stroke="#4aa8ff" stroke-width="1"/>
      <path d="M70,162 L41.5,94 L246,94 Z" fill="rgba(74,168,255,.26)" stroke="#4aa8ff" stroke-width="1"/>
      <line x1="45" y1="94" x2="246" y2="94" stroke="#4aa8ff" stroke-width="2.5"/>
      <line x1="60" y1="166" x2="29" y2="92" stroke="#dfe7ee" stroke-width="6" stroke-linecap="round"/>
      <line x1="70" y1="162" x2="39" y2="88" stroke="#93a4b3" stroke-width="6" stroke-linecap="round"/>
      <text x="2" y="84" font-size="12" fill="#dfe7ee">原挡板</text>
      <text x="52" y="72" font-size="12" fill="#93a4b3">新挡板</text>
      <line x1="150" y1="126" x2="76" y2="147" stroke="#b18cff" stroke-width="4.5" stroke-linecap="round" marker-end="url(#aNew)"/>
      <text x="120" y="86" font-size="12" fill="#b18cff">F新 ≈1000 吨力</text>
      <line x1="52" y1="150" x2="16" y2="164" stroke="#ff9f43" stroke-width="4.5" stroke-linecap="round" marker-end="url(#aOld)"/>
      <text x="168" y="190" text-anchor="middle" font-size="13" fill="#ff9f43">F原 仍 ≈1000 吨力，纹丝不动</text>
      <text x="168" y="209" text-anchor="middle" font-size="12" fill="#e6edf3">两板之间那条缝：只有约 1 kg 水</text>
    </svg>
